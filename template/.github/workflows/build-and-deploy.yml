# Construit l'image de production ICI (jamais sur le serveur), la publie sur
# ghcr.io, puis demande à Coolify de la télécharger (Dockerfile.deploy).
#
# Réglages du dépôt GitHub (Settings → Secrets and variables → Actions) :
# - Variables : NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
#   NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_APP_NAME (publiques par nature),
#   COOLIFY_URL, COOLIFY_APP_UUIDS (séparés par des virgules).
# - Secret : COOLIFY_TOKEN (Coolify → Keys & Tokens, droit « deploy »).
#   Sans lui : image publiée, aucun déploiement.
name: Build & deploy (production)

on:
  push:
    branches: [main]
  # Sur une PR : on vérifie que l'image se construit, sans rien déployer.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-and-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nom d'image en minuscules
        id: img
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.img.outputs.repo }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', steps.img.outputs.repo) || '' }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_APP_NAME=${{ vars.NEXT_PUBLIC_APP_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      UUIDS: ${{ vars.COOLIFY_APP_UUIDS }}
    steps:
      - name: Demander à Coolify de télécharger et relancer
        run: |
          if [ -z "$COOLIFY_TOKEN" ] || [ -z "$COOLIFY_URL" ] || [ -z "$UUIDS" ]; then
            echo "::warning::COOLIFY_TOKEN / COOLIFY_URL / COOLIFY_APP_UUIDS absents : image publiée, aucun déploiement."
            exit 0
          fi
          curl --fail-with-body -sS -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$UUIDS&force=false"
